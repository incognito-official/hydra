name: Rust check x86
on: workflow_dispatch

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Fetch crates
        run: cargo +nightly fetch --manifest-path native/hydra-native/Cargo.toml

      - name: Show where ctor and dtor check the target
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $reg = Get-ChildItem "$cargoHome\registry\src" -Directory | Select-Object -First 1
          $dirs = Get-ChildItem $reg.FullName -Directory | Where-Object { $_.Name -match '^(ctor|dtor|ctor-proc-macro|link-section|linktime[a-z-]*)-[0-9]' }
          foreach ($d in $dirs) {
            Write-Host "== $($d.Name)"
            Get-ChildItem $d.FullName -Recurse -Filter *.rs | Select-String -Pattern 'target_vendor = "pc"', 'not supported on the current target' | ForEach-Object { Write-Host ("  " + $_.Path.Replace($d.FullName, '') + ':' + $_.LineNumber + ': ' + $_.Line.Trim()) }
          }

      - name: Patch ctor and dtor to treat Win7 targets as Windows
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $reg = Get-ChildItem "$cargoHome\registry\src" -Directory | Select-Object -First 1
          $dirs = Get-ChildItem $reg.FullName -Directory | Where-Object { $_.Name -match '^(ctor|dtor|ctor-proc-macro|link-section|linktime[a-z-]*)-[0-9]' }
          foreach ($d in $dirs) {
            Get-ChildItem $d.FullName -Recurse -Filter *.rs | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              if ($text -match 'target_vendor = "pc"') {
                Set-Content $_.FullName ($text -replace 'target_vendor = "pc"', 'target_os = "windows"') -NoNewline
                Write-Host "patched $($_.FullName)"
              }
            }
          }

      - name: Check hydra-native for Win7 x86
        env:
          HYDRA_TORRENT_LIB_DIR: ${{ github.workspace }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +nightly check "-Zbuild-std=std,panic_abort" --target i686-win7-windows-msvc --manifest-path native/hydra-native/Cargo.toml --target-dir native/hydra-native/target
